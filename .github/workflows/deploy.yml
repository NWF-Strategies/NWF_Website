name: Build SSG and Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Chrome dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1 libnss3 libatk-bridge2.0-0 libxkbcommon0 libxcomposite1 libxrandr2 libxdamage1 libcups2 libasound2t64

      - name: Install dependencies
        run: npm ci

      - name: Build with SSG (react-snap)
        run: npm run build:ssg

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy prebuilt dist to Vercel
        run: vercel deploy ./dist --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
