<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#071c1d" />
    <title>404 — Page not found | NWF Strategies</title>
    <style>
      @font-face{font-family:DM Sans;src:url('/fonts/dm-sans-latin.woff2') format('woff2');font-display:swap}
      @font-face{font-family:Instrument Serif;src:url('/fonts/instrument-serif-italic-latin.woff2') format('woff2');font-style:italic;font-display:swap}
      *{box-sizing:border-box}body{margin:0;background:#071c1d;color:#fffdf7;font-family:'DM Sans',Arial,sans-serif}
      main{display:grid;min-height:100vh;place-items:center;padding:48px;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:72px 72px}
      section{width:min(100%,1100px)}small{color:#62d9e8;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
      h1{max-width:900px;margin:28px 0 0;font-size:clamp(4rem,12vw,9rem);letter-spacing:-.075em;line-height:.82}
      h1 em{color:#62d9e8;font-family:'Instrument Serif',Georgia,serif;font-weight:400}
      p{max-width:620px;margin:32px 0 0;color:rgba(255,253,247,.7);font-size:1.08rem;line-height:1.65}
      nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}a{display:inline-flex;min-height:52px;align-items:center;padding:12px 20px;border:1px solid rgba(255,255,255,.35);border-radius:999px;color:inherit;font-weight:700;text-decoration:none}
      a:first-child{border-color:#fffdf7;background:#fffdf7;color:#071c1d}a:focus-visible{outline:3px solid #ff704f;outline-offset:4px}
    </style>
  </head>
  <body>
    <main>
      <section>
        <small>404 / page not found</small>
        <h1>Wrong turn.<br /><em>New way forward.</em></h1>
        <p>The page moved, the link broke, or the campaign changed. The work and the way forward are still here.</p>
        <nav aria-label="Page not found navigation">
          <a href="/">Back home</a>
          <a href="/solutions">See the work</a>
        </nav>
      </section>
    </main>
  </body>
</html>
